<div class="developer-shell min-h-screen bg-base-200 px-3 py-6 sm:px-6 lg:px-10">
  <div class="terminal-frame mx-auto w-full max-w-7xl overflow-hidden border border-base-300/80 bg-base-100 shadow-2xl">
    <header class="terminal-header flex flex-wrap items-center justify-between gap-3 border-b border-base-300 px-4 py-3 sm:px-6">
      <div class="flex items-center gap-3">
        <div class="terminal-sigil" aria-hidden="true">
          <span>&gt;_</span>
        </div>
        <div>
          <div class="text-xs font-bold uppercase tracking-[0.2em] text-base-content/80 sm:text-sm">Nyakatya Terminal</div>
          <div class="mt-0.5 font-mono text-[0.65rem] text-primary/70">developer-mode / session.active</div>
        </div>
      </div>
      <button
        routerLink="/portfolio"
        title="Close developer mode"
        aria-label="Close developer mode"
        class="close-button flex h-8 w-8 items-center justify-center border border-transparent text-xl text-base-content/60 transition-colors hover:border-error hover:bg-error hover:text-error-content">
        <span aria-hidden="true">&times;</span>
      </button>
    </header>

    <div class="terminal-grid gap-4 p-3 sm:p-5 lg:grid-cols-[minmax(0,1.05fr)_minmax(20rem,0.95fr)]">
      <section class="terminal-pane flex min-h-[25rem] flex-col border border-base-300/80 bg-base-300/60 p-4 sm:p-5" aria-label="Command terminal">
        <div class="mb-4 flex items-center justify-between border-b border-base-content/10 pb-3">
          <div class="flex items-center gap-2 font-mono text-xs text-base-content/60">
            <span class="text-primary">01</span>
            <span>~/portfolio</span>
          </div>
          <span class="status-readout"><span class="status-dot"></span>link:active</span>
        </div>
        <div class="min-h-0 flex-1 overflow-y-auto pb-4 font-mono text-sm leading-7 custom-scrollbar" aria-live="polite">
          <p *ngFor="let line of output" class="terminal-line text-base-content/80">
            {{ line }}
          </p>
        </div>
        <div class="command-line mt-4 flex items-center border border-primary/20 bg-base-100/50 px-3 py-2">
          <span class="mr-2 font-mono font-bold text-primary">$</span>
          <input
            type="text"
            [(ngModel)]="command"
            (keydown.enter)="executeCommand()"
            placeholder="type a command..."
            aria-label="Terminal command"
            class="min-w-0 flex-1 bg-transparent px-1 font-mono text-sm text-base-content placeholder:text-base-content/35 focus:outline-none"
            autofocus>
        </div>
        <div class="mt-3 flex flex-wrap gap-x-4 gap-y-1 font-mono text-[0.65rem] uppercase tracking-wider text-base-content/40">
          <span>enter run</span><span>help commands</span><span>clear reset</span>
        </div>
      </section>

      <section
        class="result-container border border-base-300/80 bg-base-200/70 p-4 transition-all duration-300 ease-in-out sm:p-5"
        [ngClass]="{
          'min-h-[25rem] flex items-center justify-center text-base-content/50': !activeTab,
          'min-h-[25rem] max-h-[42rem] overflow-y-auto': activeTab
        }"
      >
        <ng-container [ngSwitch]="activeTab">

          <ng-container *ngSwitchCase="'about'">
            <app-about class="w-full h-full animate-fade-in"></app-about>
          </ng-container>

          <ng-container *ngSwitchCase="'skills'">
            <app-skills class="w-full h-full animate-fade-in"></app-skills>
          </ng-container>

          <ng-container *ngSwitchCase="'projects'">
            <app-projects class="w-full h-full animate-fade-in"></app-projects>
          </ng-container>

          <ng-container *ngSwitchCase="'contacts'">
            <app-contact class="w-full h-full animate-fade-in"></app-contact>
          </ng-container>

          <ng-container *ngSwitchCase="'contact-me'">
            <app-contact-me class="w-full h-full animate-fade-in"></app-contact-me>
          </ng-container>

          <ng-container *ngSwitchDefault>
            <div class="empty-state text-center">
              <div class="mb-4 font-mono text-4xl text-primary/40">/&gt;_</div>
              <p class="font-mono text-sm text-base-content/50">Type <span class="text-primary">'help'</span> to get started.</p>
              <p class="mt-2 text-xs text-base-content/35">Your selected section will appear here.</p>
            </div>
          </ng-container>

        </ng-container>
      </section>

    </div>
  </div>
</div>
