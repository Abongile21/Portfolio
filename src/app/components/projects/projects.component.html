<div class="mx-auto w-full max-w-7xl py-4">
  <div class="section-shell relative animate-fade-up">
    <div class="accent-glow"></div>
    <div class="relative">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <span class="hero-pill">Selected work</span>
          <h2 class="section-title mt-3">Featured Projects</h2>
        </div>
        <p class="max-w-xl text-sm leading-relaxed text-base-content/70 sm:text-base">A mix of polished interfaces, practical web experiences, and thoughtful product thinking.</p>
      </div>

      <div class="mt-8 grid gap-6 md:grid-cols-2 xl:grid-cols-3">
        <div *ngFor="let project of projects" class="group relative overflow-hidden rounded-[1.5rem] border border-sky-400/20 bg-slate-950/70 shadow-[0_18px_45px_-20px_rgba(14,165,233,0.4)] interactive-lift">
          <div class="absolute inset-0 bg-gradient-to-t from-sky-500/20 via-transparent to-transparent opacity-0 transition-opacity duration-500 group-hover:opacity-100"></div>
          <img [src]="project.image" alt="{{ project.title }}" class="h-48 w-full object-cover transition-transform duration-500 group-hover:scale-105">

          <div class="relative p-6">
            <h3 class="text-2xl font-semibold text-sky-200">{{ project.title }}</h3>
            <p class="mt-3 text-sm leading-relaxed text-base-content/70">{{ project.description }}</p>

            <div class="mt-4 flex flex-wrap gap-2">
              <span *ngFor="let tech of project.technologies" class="rounded-full border border-sky-400/20 bg-sky-400/10 px-3 py-1 text-xs font-medium uppercase tracking-[0.2em] text-sky-200">{{ tech }}</span>
            </div>

            <a [href]="project.link" target="_blank" class="btn btn-info btn-sm mt-6 interactive-lift focus-ring">View Project</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
