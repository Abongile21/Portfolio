<div class="mx-auto w-full max-w-6xl py-4">
  <div class="section-shell relative animate-fade-up">
    <div class="accent-glow"></div>
    <div class="relative">
      <span class="hero-pill">Core toolbox</span>
      <h2 class="section-title mt-3">Skills</h2>
      <p class="mt-3 max-w-2xl text-sm leading-relaxed text-base-content/70 sm:text-base">A mix of front-end craft, product thinking, and modern build practices that help turn concepts into polished experiences.</p>

      <div class="mt-8 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
        <div *ngFor="let skill of skills" class="flex flex-col items-center rounded-[1.25rem] border border-sky-400/20 bg-sky-400/10 p-5 text-center interactive-lift">
          <img class="h-16 w-16 object-contain transition-transform duration-300 hover:scale-110" [src]="skill" [alt]="skill" />
        </div>
      </div>
    </div>
  </div>
</div>
