<div class="mx-auto w-full max-w-6xl py-4">
  <div class="section-shell relative animate-fade-up">
    <div class="accent-glow"></div>
    <div class="relative">
      <span class="hero-pill">Core toolbox</span>
      <h2 class="section-title mt-3">Skills</h2>
      <p class="mt-3 max-w-2xl text-sm leading-relaxed text-base-content/70 sm:text-base">Web and cross-platform development skills for building complete, polished applications.</p>

      <div class="mt-5 flex flex-wrap gap-2" aria-label="Application development">
        <span class="rounded-full border border-sky-400/25 bg-sky-400/10 px-3 py-1.5 text-sm font-semibold text-sky-200">.NET MAUI</span>
        <span class="rounded-full border border-sky-400/25 bg-sky-400/10 px-3 py-1.5 text-sm font-semibold text-sky-200">C#</span>
        <span class="rounded-full border border-sky-400/25 bg-sky-400/10 px-3 py-1.5 text-sm font-semibold text-sky-200">Cross-platform apps</span>
      </div>

      <div class="mt-8 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
        @for (skill of skills; track skill) {
        <div class="flex flex-col items-center rounded-[1.25rem] border border-sky-400/20 bg-sky-400/10 p-5 text-center interactive-lift">
          <img class="h-16 w-16 object-contain transition-transform duration-300 hover:scale-110" [src]="skill" [alt]="skill" />
        </div>
        }
      </div>
    </div>
  </div>
</div>
