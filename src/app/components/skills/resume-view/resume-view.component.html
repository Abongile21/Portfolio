<div class="min-h-screen bg-base-200 p-6 flex flex-col items-center">

  <!-- Header -->
  <div class="w-full max-w-5xl flex flex-col sm:flex-row justify-between items-center mb-8 bg-slate-900/80 backdrop-blur-lg p-5 rounded-2xl shadow-2xl border border-base-300">
   
    <!-- Controls -->
    <div class="flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto">

      <!-- Zoom Controls -->
      <div class="flex items-center gap-3 bg-slate-800/80 px-4 py-2 rounded-xl shadow-inner w-full sm:w-auto">
        <button (click)="zoomOut()" class="btn btn-primary btn-circle btn-sm" aria-label="Zoom out">-</button>

        <input type="range" min="0.5" max="2" step="0.1" [(ngModel)]="zoom" class="range range-primary w-32" />

        <button (click)="zoomIn()" class="btn btn-primary btn-circle btn-sm" aria-label="Zoom in">+</button>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-3">
        <button (click)="downloadResume()" class="btn btn-primary">
          <i class="fas fa-download mr-2"></i> Download
        </button>
        <button (click)="goBack()" class="btn btn-error">
          <i class="fas fa-sign-out-alt mr-2"></i> Exit
        </button>
      </div>

    </div>
  </div>

  <!-- PDF Viewer -->
  <div class="w-full max-w-5xl flex-grow flex justify-center items-center bg-slate-900/70 backdrop-blur-md rounded-2xl shadow-2xl border border-base-300 p-4">
    <div class="w-full bg-slate-800/80 rounded-xl p-2 sm:p-4 shadow-inner">
      <iframe
        [src]="pdfSrc"
        title="Resume preview"
        class="w-full rounded-lg border-0"
        style="height: 80vh; min-height: 640px;"
      ></iframe>
    </div>
  </div>

</div>
