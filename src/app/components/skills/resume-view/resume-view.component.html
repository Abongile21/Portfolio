<main class="resume-view min-h-screen px-4 py-5 sm:px-8 lg:px-12">
  <div class="resume-layout mx-auto flex w-full max-w-7xl flex-col">
    <header class="resume-toolbar flex flex-col gap-5 border-b border-sky-400/20 pb-5 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <div class="document-label mb-3 flex items-center gap-2 font-mono text-xs uppercase tracking-[0.24em]">
          <span class="status-dot"></span>
          <span>Document viewer / 01</span>
        </div>
        <h1 class="text-2xl font-semibold tracking-tight text-slate-100 sm:text-3xl">Resume</h1>
        <p class="mt-1 text-sm text-slate-400">Theo Nyakatya · Full-stack developer</p>
      </div>

      <div class="flex flex-col gap-3 sm:items-end">
        <div class="flex gap-2">
          <button (click)="downloadResume()" class="viewer-action-button viewer-action-primary">
            <svg class="document-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3" />
            </svg>
            <span>Download PDF</span>
          </button>
          <button (click)="goBack()" class="viewer-action-button">
            <svg class="document-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m10 19-7-7 7-7M3 12h18" />
            </svg>
            <span>Back to portfolio</span>
          </button>
        </div>
      </div>
    </header>

    <section class="document-stage mt-6 flex-1 p-2 sm:p-4" aria-label="Resume preview">
      <div class="document-meta flex items-center justify-between px-2 pb-3 font-mono text-[0.65rem] uppercase tracking-[0.16em] text-slate-500 sm:px-4">
        <span>preview.pdf</span>
        <span class="hidden sm:inline">read-only</span>
      </div>
      <iframe [src]="pdfSrc" title="Resume preview" class="resume-frame w-full rounded-sm border-0"></iframe>
    </section>
  </div>
</main>
