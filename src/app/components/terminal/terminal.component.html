
  <div class="fixed top-0 left-0 right-0 z-10 text-center">
    <div class="welcome-message text-white">
      @for (word of welcomeMessage; track $index; let wordIndex = $index) {
        @for (letter of word.split(''); track $index; let letterIndex = $index) {
        <span class="word" [style.animation-delay]="(wordIndex * 0.5 + letterIndex * 0.1) + 's'">
          {{ letter }}
        </span>
        }
        @if (wordIndex < welcomeMessage.length - 1) {
        <span class="space"> </span>
        }
      }
    </div>
  </div>
