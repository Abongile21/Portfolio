<div class="landing-shell relative min-h-screen overflow-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-sky-950 px-6 py-20 flex items-center justify-center">
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="animate-float-slow absolute left-8 top-12 h-24 w-24 rounded-full bg-sky-400/20 blur-3xl"></div>
    <div class="animate-float absolute bottom-10 right-8 h-32 w-32 rounded-full bg-cyan-400/20 blur-3xl"></div>
    <div class="landing-grid absolute inset-0"></div>
  </div>

  <div class="glass-panel relative z-10 w-full max-w-2xl p-8 text-center sm:p-10">
    <div class="landing-system-row" aria-hidden="true">
      <span>SYS.PORTFOLIO</span>
      <span>STATUS: ONLINE</span>
    </div>
    <span class="hero-pill">SOFTWARE ENGINEER // FULL-STACK</span>
    <h2 class="mt-5 text-4xl font-black tracking-[0.12em] text-sky-300 sm:text-5xl">ABONGILE<span class="text-sky-100">_DEV</span></h2>
    <p class="mt-4 text-base leading-relaxed text-base-content/70">I design and build reliable web and cross-platform products — from system architecture and APIs to polished, accessible interfaces.</p>

    <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-between">
      <button routerLink="/developer-mode" class="btn btn-info flex-1 interactive-lift focus-ring" (click)="viewAsDeveloper()">Execute: Developer</button>
      <button routerLink="/portfolio" class="btn btn-outline btn-info flex-1 interactive-lift focus-ring" (click)="viewAsNonDeveloper()">Open: Portfolio</button>
    </div>
  </div>
</div>
