<div class="portfolio-shell relative min-h-screen flex flex-col overflow-hidden bg-transparent">
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="animate-float-slow absolute left-0 top-16 h-48 w-48 rounded-full bg-sky-400/10 blur-3xl"></div>
    <div class="animate-float absolute bottom-8 right-0 h-56 w-56 rounded-full bg-cyan-400/10 blur-3xl"></div>
  </div>

  <nav
    class="portfolio-nav fixed left-1/2 top-4 z-50 w-[calc(100%-1.5rem)] max-w-7xl -translate-x-1/2 rounded-2xl border border-sky-300/15 bg-slate-950/85 px-3 py-2 shadow-[0_20px_50px_-20px_rgba(14,165,233,0.45)] backdrop-blur-xl sm:px-5"
    [class.menu-open]="isMenuOpen"
    aria-label="Primary navigation">
    <div class="nav-toolbar flex min-h-12 items-center justify-between gap-3">
      <a
        routerLink="/"
        class="brand interactive focus-ring"
        [class.brand-active]="activeSection === 'profile'"
        [attr.aria-current]="activeSection === 'profile' ? 'page' : null"
        aria-label="Abongile Nyakatya, home">
        <span class="brand-mark" aria-hidden="true">AN</span>
        <span class="brand-copy">
          <strong>Abongile Nyakatya</strong>
          <small>Software Engineer</small>
        </span>
      </a>

      <div class="hidden items-center justify-center gap-1 lg:flex">
        <button type="button" class="nav-link btn btn-ghost btn-sm uppercase interactive focus-ring" [class.nav-link-active]="activeSection === 'about'" [attr.aria-current]="activeSection === 'about' ? 'location' : null" (click)="scrollToElement('about')">About</button>
        <button type="button" class="nav-link btn btn-ghost btn-sm uppercase interactive focus-ring" [class.nav-link-active]="activeSection === 'skills'" [attr.aria-current]="activeSection === 'skills' ? 'location' : null" (click)="scrollToElement('skills')">Skills</button>
        <button type="button" class="nav-link btn btn-ghost btn-sm uppercase interactive focus-ring" [class.nav-link-active]="activeSection === 'education'" [attr.aria-current]="activeSection === 'education' ? 'location' : null" (click)="scrollToElement('education')">Education</button>
        <button type="button" class="nav-link btn btn-ghost btn-sm uppercase interactive focus-ring" [class.nav-link-active]="activeSection === 'experience'" [attr.aria-current]="activeSection === 'experience' ? 'location' : null" (click)="scrollToElement('experience')">Work</button>
        <button type="button" class="nav-link btn btn-ghost btn-sm uppercase interactive focus-ring" [class.nav-link-active]="activeSection === 'projects'" [attr.aria-current]="activeSection === 'projects' ? 'location' : null" (click)="scrollToElement('projects')">Projects</button>
        <button type="button" class="nav-link btn btn-ghost btn-sm uppercase interactive focus-ring" [class.nav-link-active]="activeSection === 'contact-me'" [attr.aria-current]="activeSection === 'contact-me' ? 'location' : null" (click)="scrollToElement('contact-me')">Contact</button>
      </div>

      <div class="hidden items-center gap-2 lg:flex">
        <a routerLink="/resume-view" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="resume-link interactive focus-ring">Resume</a>
        <a routerLink="/developer-mode" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="dev-mode-link interactive-lift focus-ring">Dev Mode</a>
      </div>

      <button
        #hamburger
        type="button"
        class="menu-toggle interactive focus-ring flex lg:hidden"
        (click)="toggleMenu()"
        [attr.aria-label]="isMenuOpen ? 'Close navigation' : 'Open navigation'"
        [attr.aria-expanded]="isMenuOpen"
        aria-controls="primary-mobile-navigation">
        <svg viewBox="0 0 24 24" class="h-5 w-5 fill-none stroke-current" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          @if (isMenuOpen) {
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          } @else {
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          }
        </svg>
        <span>{{ isMenuOpen ? 'Close' : 'Menu' }}</span>
      </button>
    </div>

    <div #navLinks id="primary-mobile-navigation" class="mobile-nav lg:hidden" [class.hidden]="!isMenuOpen">
      <div class="flex flex-col gap-1 py-3">
        <button type="button" class="mobile-nav-link" [class.nav-link-active]="activeSection === 'profile'" [attr.aria-current]="activeSection === 'profile' ? 'location' : null" (click)="scrollToElement('profile')">Home</button>
        <button type="button" class="mobile-nav-link" [class.nav-link-active]="activeSection === 'about'" [attr.aria-current]="activeSection === 'about' ? 'location' : null" (click)="scrollToElement('about')">About</button>
        <button type="button" class="mobile-nav-link" [class.nav-link-active]="activeSection === 'skills'" [attr.aria-current]="activeSection === 'skills' ? 'location' : null" (click)="scrollToElement('skills')">Skills</button>
        <button type="button" class="mobile-nav-link" [class.nav-link-active]="activeSection === 'education'" [attr.aria-current]="activeSection === 'education' ? 'location' : null" (click)="scrollToElement('education')">Education</button>
        <button type="button" class="mobile-nav-link" [class.nav-link-active]="activeSection === 'experience'" [attr.aria-current]="activeSection === 'experience' ? 'location' : null" (click)="scrollToElement('experience')">Work</button>
        <button type="button" class="mobile-nav-link" [class.nav-link-active]="activeSection === 'projects'" [attr.aria-current]="activeSection === 'projects' ? 'location' : null" (click)="scrollToElement('projects')">Projects</button>
        <button type="button" class="mobile-nav-link" [class.nav-link-active]="activeSection === 'contact-me'" [attr.aria-current]="activeSection === 'contact-me' ? 'location' : null" (click)="scrollToElement('contact-me')">Contact</button>
        <a routerLink="/resume-view" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="mobile-nav-link" (click)="closeMenu()">Resume</a>
        <a routerLink="/developer-mode" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="mobile-nav-link mobile-dev-link" (click)="closeMenu()">Dev Mode</a>
      </div>
    </div>
  </nav>

  <main class="flex-grow pt-20">
    <section id="profile" class="portfolio-section flex min-h-screen items-center justify-center scroll-mt-20 px-4 py-12 sm:px-6">
      <div class="mx-auto max-w-7xl">
        <app-profile></app-profile>
      </div>
    </section>

    <section id="about" class="portfolio-section flex min-h-screen items-center justify-center scroll-mt-20 px-4 py-12 sm:px-6">
      <div class="mx-auto max-w-7xl">
        <app-about></app-about>
      </div>
    </section>

    <section id="skills" class="portfolio-section flex min-h-screen items-center justify-center scroll-mt-20 px-4 py-12 sm:px-6">
      <div class="mx-auto max-w-7xl">
        <app-skills></app-skills>
      </div>
    </section>

    <section id="education" class="portfolio-section flex min-h-screen items-center justify-center scroll-mt-20 px-4 py-12 sm:px-6">
      <div class="mx-auto w-full max-w-7xl">
        <app-education></app-education>
      </div>
    </section>

    <section id="experience" class="portfolio-section flex min-h-screen items-center justify-center scroll-mt-20 px-4 py-12 sm:px-6">
      <div class="mx-auto w-full max-w-7xl">
        <app-experience></app-experience>
      </div>
    </section>

    <section id="projects" class="portfolio-section flex min-h-screen items-center justify-center scroll-mt-20 px-4 py-12 sm:px-6">
      <div class="mx-auto max-w-7xl">
        <app-projects></app-projects>
      </div>
    </section>

    <section id="contact-me" class="portfolio-section flex min-h-screen items-center justify-center scroll-mt-20 px-4 py-12 sm:px-6">
      <div class="mx-auto max-w-7xl">
        <app-contact-me></app-contact-me>
      </div>
    </section>
  </main>
</div>
