<div class="portfolio-shell relative min-h-screen flex flex-col overflow-hidden bg-transparent">
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="animate-float-slow absolute left-0 top-16 h-48 w-48 rounded-full bg-sky-400/10 blur-3xl"></div>
    <div class="animate-float absolute bottom-8 right-0 h-56 w-56 rounded-full bg-cyan-400/10 blur-3xl"></div>
  </div>

  <nav class="portfolio-nav fixed left-1/2 top-4 z-50 w-[calc(100%-1.5rem)] max-w-6xl -translate-x-1/2 rounded-full border border-sky-400/20 bg-slate-950/75 px-3 py-2 shadow-[0_20px_50px_-20px_rgba(14,165,233,0.45)] backdrop-blur-xl" aria-label="Primary navigation">
    <div class="mx-auto flex items-center justify-between px-2 sm:px-4">
      <div class="hidden sm:flex items-center text-sm font-semibold uppercase tracking-[0.25em] text-sky-200">
        Abongile
      </div>

      <button #hamburger type="button" class="rounded-full px-4 py-2 text-sm font-semibold uppercase tracking-wider text-sky-200 md:hidden interactive focus-ring" (click)="toggleMenu()" [attr.aria-label]="isMenuOpen ? 'Close navigation' : 'Open navigation'" [attr.aria-expanded]="isMenuOpen" aria-controls="primary-mobile-navigation">
        {{ isMenuOpen ? 'Close' : 'Menu' }}
      </button>

      <div class="hidden md:flex items-center justify-center gap-1">
        <a routerLink="/" class="nav-link btn btn-ghost btn-sm uppercase interactive hover:bg-sky-500/10 hover:text-sky-300" [class.nav-link-active]="activeSection === 'profile'" [attr.aria-current]="activeSection === 'profile' ? 'location' : null">Home</a>
        <a (click)="scrollToElement('about')" class="nav-link btn btn-ghost btn-sm uppercase interactive hover:bg-sky-500/10 hover:text-sky-300" [class.nav-link-active]="activeSection === 'about'" [attr.aria-current]="activeSection === 'about' ? 'location' : null">About</a>
        <a (click)="scrollToElement('skills')" class="nav-link btn btn-ghost btn-sm uppercase interactive hover:bg-sky-500/10 hover:text-sky-300" [class.nav-link-active]="activeSection === 'skills'" [attr.aria-current]="activeSection === 'skills' ? 'location' : null">Skills</a>
        <a (click)="scrollToElement('education')" class="nav-link btn btn-ghost btn-sm uppercase interactive hover:bg-sky-500/10 hover:text-sky-300" [class.nav-link-active]="activeSection === 'education'" [attr.aria-current]="activeSection === 'education' ? 'location' : null">Education</a>
        <a (click)="scrollToElement('experience')" class="nav-link btn btn-ghost btn-sm uppercase interactive hover:bg-sky-500/10 hover:text-sky-300" [class.nav-link-active]="activeSection === 'experience'" [attr.aria-current]="activeSection === 'experience' ? 'location' : null">Work</a>
        <a (click)="scrollToElement('projects')" class="nav-link btn btn-ghost btn-sm uppercase interactive hover:bg-sky-500/10 hover:text-sky-300" [class.nav-link-active]="activeSection === 'projects'" [attr.aria-current]="activeSection === 'projects' ? 'location' : null">Projects</a>
        <a (click)="scrollToElement('contact-me')" class="nav-link btn btn-ghost btn-sm uppercase interactive hover:bg-sky-500/10 hover:text-sky-300" [class.nav-link-active]="activeSection === 'contact-me'" [attr.aria-current]="activeSection === 'contact-me' ? 'location' : null">Contact</a>
        <a routerLink="/resume-view" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="nav-link btn btn-ghost btn-sm uppercase interactive hover:bg-sky-500/10 hover:text-sky-300">Resume</a>
        <a routerLink="/developer-mode" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="nav-link btn btn-info btn-sm uppercase interactive-lift focus-ring">Dev Mode</a>
      </div>
    </div>

    <div #navLinks id="primary-mobile-navigation" class="mobile-nav md:hidden bg-slate-950/95 transition duration-300" [class.hidden]="!isMenuOpen">
      <div class="flex flex-col space-y-3 p-4">
        <a routerLink="/" class="nav-link btn btn-ghost btn-sm justify-start uppercase interactive hover:bg-sky-500/10 hover:text-sky-300" [class.nav-link-active]="activeSection === 'profile'" [attr.aria-current]="activeSection === 'profile' ? 'location' : null" (click)="closeMenu()">Home</a>
        <a (click)="scrollToElement('about')" class="nav-link btn btn-ghost btn-sm justify-start uppercase interactive hover:bg-sky-500/10 hover:text-sky-300" [class.nav-link-active]="activeSection === 'about'" [attr.aria-current]="activeSection === 'about' ? 'location' : null">About</a>
        <a (click)="scrollToElement('skills')" class="nav-link btn btn-ghost btn-sm justify-start uppercase interactive hover:bg-sky-500/10 hover:text-sky-300" [class.nav-link-active]="activeSection === 'skills'" [attr.aria-current]="activeSection === 'skills' ? 'location' : null">Skills</a>
        <a (click)="scrollToElement('education')" class="nav-link btn btn-ghost btn-sm justify-start uppercase interactive hover:bg-sky-500/10 hover:text-sky-300" [class.nav-link-active]="activeSection === 'education'" [attr.aria-current]="activeSection === 'education' ? 'location' : null">Education</a>
        <a (click)="scrollToElement('experience')" class="nav-link btn btn-ghost btn-sm justify-start uppercase interactive hover:bg-sky-500/10 hover:text-sky-300" [class.nav-link-active]="activeSection === 'experience'" [attr.aria-current]="activeSection === 'experience' ? 'location' : null">Work</a>
        <a (click)="scrollToElement('projects')" class="nav-link btn btn-ghost btn-sm justify-start uppercase interactive hover:bg-sky-500/10 hover:text-sky-300" [class.nav-link-active]="activeSection === 'projects'" [attr.aria-current]="activeSection === 'projects' ? 'location' : null">Projects</a>
        <a (click)="scrollToElement('contact-me')" class="nav-link btn btn-ghost btn-sm justify-start uppercase interactive hover:bg-sky-500/10 hover:text-sky-300" [class.nav-link-active]="activeSection === 'contact-me'" [attr.aria-current]="activeSection === 'contact-me' ? 'location' : null">Contact</a>
        <a routerLink="/resume-view" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="nav-link btn btn-ghost btn-sm justify-start uppercase interactive hover:bg-sky-500/10 hover:text-sky-300" (click)="closeMenu()">Resume</a>
        <a routerLink="/developer-mode" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="nav-link btn btn-info btn-sm justify-start uppercase interactive-lift focus-ring" (click)="closeMenu()">Dev Mode</a>
      </div>
    </div>
  </nav>

  <main class="flex-grow pt-20">
    <section id="profile" class="portfolio-section flex min-h-screen items-center justify-center scroll-mt-20 px-4 py-12 sm:px-6">
      <div class="mx-auto max-w-7xl">
        <app-profile></app-profile>
      </div>
    </section>

    <section id="about" class="portfolio-section flex min-h-screen items-center justify-center scroll-mt-20 px-4 py-12 sm:px-6">
      <div class="mx-auto max-w-7xl">
        <app-about></app-about>
      </div>
    </section>

    <section id="skills" class="portfolio-section flex min-h-screen items-center justify-center scroll-mt-20 px-4 py-12 sm:px-6">
      <div class="mx-auto max-w-7xl">
        <app-skills></app-skills>
      </div>
    </section>

    <section id="education" class="portfolio-section flex min-h-screen items-center justify-center scroll-mt-20 px-4 py-12 sm:px-6">
      <div class="mx-auto w-full max-w-7xl">
        <app-education></app-education>
      </div>
    </section>

    <section id="experience" class="portfolio-section flex min-h-screen items-center justify-center scroll-mt-20 px-4 py-12 sm:px-6">
      <div class="mx-auto w-full max-w-7xl">
        <app-experience></app-experience>
      </div>
    </section>

    <section id="projects" class="portfolio-section flex min-h-screen items-center justify-center scroll-mt-20 px-4 py-12 sm:px-6">
      <div class="mx-auto max-w-7xl">
        <app-projects></app-projects>
      </div>
    </section>

    <section id="contact-me" class="portfolio-section flex min-h-screen items-center justify-center scroll-mt-20 px-4 py-12 sm:px-6">
      <div class="mx-auto max-w-7xl">
        <app-contact-me></app-contact-me>
      </div>
    </section>
  </main>
</div>
