
<main class="mx-auto w-full max-w-6xl py-4">
  <section class="section-shell relative animate-fade-up">
    <div class="accent-glow"></div>
    <div class="relative">
      <span class="hero-pill">Selected experience</span>
      <h1 class="section-title mt-3">Work Experience</h1>
      <p class="mt-3 max-w-2xl text-sm leading-relaxed text-base-content/70 sm:text-base">A practical record of the teams, products, and responsibilities behind the work.</p>

      <div class="mt-8 grid gap-4 md:grid-cols-2">
        <article *ngFor="let exp of experience" class="rounded-2xl border border-sky-400/20 bg-sky-400/10 p-5">
          <h2 class="text-xl font-semibold text-base-content">{{ exp.title }}</h2>
          <div class="mt-2 flex flex-wrap gap-x-2 text-sm text-base-content/70">
            <span>{{ exp.company }}</span><span aria-hidden="true">·</span><span>{{ exp.period }}</span>
          </div>
          <ul class="mt-5 space-y-3">
            <li *ngFor="let responsibility of exp.responsibilities" class="flex items-start gap-2 text-sm leading-relaxed text-base-content/80">
              <span class="mt-1 text-sky-500" aria-hidden="true">→</span>
              <span>{{ responsibility }}</span>
            </li>
          </ul>
        </article>
      </div>
    </div>
  </section>
</main>
